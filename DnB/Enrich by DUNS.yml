info:
  name: Enrich by DUNS
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/data/duns/:duns?blockIDs=companyinfo_L1_v1"
  params:
    - name: blockIDs
      value: companyinfo_L1_v1
      type: query
    - name: duns
      value: "123456789"
      type: path
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: ""
        method: jsonq
      variable:
        name: duns
        scope: runtime
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
